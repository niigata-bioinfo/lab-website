name: GitHub Pages

# main への push でサイト全体をビルドし、GitHub Pages に公開する (テスト公開用)。
# リポジトリの Settings → Pages → Build and deployment → Source を "GitHub Actions" にしておくこと。
# 公開 URL は https://<owner>.github.io/<repo>/ になるため、BASE_PATH にリポジトリ名を渡してビルドする。
# カスタムドメインを割り当てた場合は BASE_PATH を "/" に、SITE_URL をそのドメインに変える。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build for GitHub Pages
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
