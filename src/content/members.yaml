faculty:
  - name:
      ja: 奥田　修二郎
      en: Shujiro Okuda
    title:
      ja: 新潟大学医学部メディカルAIセンター　教授（センター長）
      en: Professor
    degree: Ph.D.
    affiliation:
      en: |
        Medical AI Center, School of Medicine, Niigata University
        Niigata University Graduate School of Medical and Dental Sciences
    bio:
      ja:
        - heading: 経歴
          items:
            - 2021年4月〜現在　新潟大学医学部メディカルAIセンター　教授
            - 2021年4月〜現在　新潟大学病院ゲノム医療部ゲノム情報管理センター　センター長
            - 2018年1月〜2021年3月　新潟大学医歯学総合病院ゲノム医療センター　副部長
            - 2017年4月〜2021年3月　新潟大学大学院医歯学総合研究科　准教授
            - 2016年10月〜2021年3月　新潟大学研究推進機構　研究教授
            - 2013年2月～2017年3月 　新潟大学大学院医歯学総合研究科　テニュア・トラック准教授
            - 2010年4月～2010年9月 　ベルギー・ブリュッセル自由大学　客員研究員
            - 2008年4月～2013年1月 　立命館大学生命科学部生命情報学科 助教
            - 2007年6月～2008年3月 　京都大学化学研究所バイオインフォマティクスセンター 博士研究員
            - 2006年4月～2007年5月 　京都大学化学研究所バイオインフォマティクスセンター 教務補佐員
        - heading: 学歴
          items:
            - 2007年5月　京都大学　博士(理学)
            - 2006年3月　京都大学大学院理学研究科 博士課程研究指導認定退学
            - 2003年3月　京都大学大学院理学研究科 修士課程修了
            - 2001年3月　立命館大学理工学部生物工学科 卒業
