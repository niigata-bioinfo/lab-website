# 旧 WordPress サイトの URL を新サイトへ 301 リダイレクトする nginx 設定。
# 使い方:
#   http {} ブロックで   include /path/to/legacy-ids.map;        (投稿 ID → 新 URL の対応表)
#   server {} ブロックで include /path/to/nginx-redirects.conf;  (このファイル)
# 言語は旧サイトの ?lang=en を見て /en/ 配下へ振り分ける。

# ---- 旧 URL に ?lang=en が付いている場合は英語ページへ ----
set $lp "";
if ($arg_lang = "en") { set $lp "/en"; }

# 固定ページ (日本語版)
location = /intro-ja     { return 301 /introduction/; }
location = /members-ja   { return 301 /members/; }
location = /access-ja    { return 301 /access/; }
location = /link-ja      { return 301 /links/; }
location = /news         { return 301 /news/; }
location = /recruitment  { return 301 /recruitment/; }
location = /home_intro_ja { return 301 /; }

# 固定ページ (英語版。?lang=en の有無に関わらず英語ページへ)
location = /introduction { return 301 /en/introduction/; }
location = /members      { return 301 /en/members/; }
location = /access       { return 301 /en/access/; }
location = /link         { return 301 /en/links/; }
location = /news-en      { return 301 /en/news/; }
location = /home_intro_en { return 301 /en/; }
location = /archives/news-en { return 301 /en/news/; }
location = /archives/members-en { return 301 /en/members/; }

# 一覧 (言語はクエリで判定)
location = /publications           { return 301 $lp/publications/; }
location = /archives/publications  { return 301 $lp/publications/; }
location = /archives/publications/ { return 301 $lp/publications/; }
location = /archives/news          { return 301 $lp/news/; }
location = /archives/news/         { return 301 $lp/news/; }
location = /archives/members       { return 301 $lp/members/; }
location = /archives/members/      { return 301 $lp/members/; }
location ~ ^/publications/page/(\d+)/?$          { return 301 $lp/publications/page/$1/; }
location ~ ^/archives/publications-cat/([a-z]+)/?$ { return 301 $lp/publications/type/$1/; }

# 個別ページ。新サイトに ID は無いので、legacy-ids.map の対応表で年別ページのアンカー / お知らせのファイル名へ送る。
# 対応表に無い ID (将来追加されることは無い) は一覧へ。
location ~ ^/archives/publications/\d+/?$ {
  if ($legacy_target) { return 301 $lp$legacy_target; }
  return 301 $lp/publications/;
}
location ~ ^/archives/news/\d+/?$ {
  if ($legacy_target) { return 301 $lp$legacy_target; }
  return 301 $lp/news/;
}

# 旧 WordPress の管理系はサイトごと消えたことを明示する
location ~ ^/(wp-admin|wp-login\.php|wp-json|xmlrpc\.php|feed)(/|$) { return 410; }

# 旧テーマの静的ファイル (他サイトから直リンクされている可能性のある画像)
location = /wp-content/themes/bioinfo_wp/icon.png { return 301 /icon.png; }
location = /wp-content/themes/bioinfo_wp/images/detail_map_new.jpg { return 301 /images/detail_map_new.jpg; }
location = /wp-content/themes/bioinfo_wp/images/detail_map_en_new.jpg { return 301 /images/detail_map_en_new.jpg; }
